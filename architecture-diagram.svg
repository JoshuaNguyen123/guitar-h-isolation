<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1320" role="img" aria-labelledby="title desc">
  <title id="title">Guitar H Isolation architecture</title>
  <desc id="desc">
    Desktop UI starts a worker thread. FFmpeg decodes the file. Demucs splits six stems
    using a Hugging Face ONNX model. Guitar goes to Basic Pitch. Backing goes to tempo
    detection. Notes map to five frets and four difficulties, then the app writes a
    Clone Hero folder: song.ogg, guitar.ogg, song.ini, notes.chart.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8c36a"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8eb4c4"/>
    </marker>
    <style>
      .bg { fill: #1c1914; }
      .band { fill: #262218; stroke: #3a3428; stroke-width: 1.5; }
      .box { fill: #2f2a22; stroke: #c4892a; stroke-width: 1.8; }
      .box-ui { fill: #3a2f18; stroke: #e8c36a; stroke-width: 2; }
      .box-out { fill: #2a3324; stroke: #9cbf7a; stroke-width: 1.8; }
      .box-side { fill: #243038; stroke: #8eb4c4; stroke-width: 1.8; }
      .title { fill: #e8c36a; font-family: Segoe UI, Calibri, sans-serif; font-size: 28px; font-weight: 700; }
      .band-label { fill: #e8c36a; font-family: Segoe UI, Calibri, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .h { fill: #f4ead4; font-family: Segoe UI, Calibri, sans-serif; font-size: 16px; font-weight: 700; }
      .p { fill: #c4b8a0; font-family: Segoe UI, Calibri, sans-serif; font-size: 13px; }
      .tiny { fill: #a89b84; font-family: Segoe UI, Calibri, sans-serif; font-size: 11px; }
      .line { stroke: #e8c36a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-muted { stroke: #8eb4c4; stroke-width: 2; fill: none; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect class="bg" width="1100" height="1320"/>
  <text class="title" x="40" y="48">How Guitar H Isolation is built</text>
  <text class="p" x="40" y="74">Local file in. Four Clone Hero files out. Guitar chart only. Machine draft, not official content.</text>

  <!-- Layer 1: UI -->
  <rect class="band" x="24" y="96" width="1052" height="168" rx="12"/>
  <text class="band-label" x="44" y="122">LAYER 1  ·  DESKTOP WINDOW  ·  src/app</text>

  <rect class="box-ui" x="48" y="140" width="220" height="96" rx="10"/>
  <text class="h" x="158" y="178" text-anchor="middle">Your audio file</text>
  <text class="p" x="158" y="200" text-anchor="middle">MP3, WAV, FLAC, OGG, M4A</text>
  <text class="tiny" x="158" y="218" text-anchor="middle">you must have the right to use it</text>

  <rect class="box-ui" x="320" y="140" width="250" height="96" rx="10"/>
  <text class="h" x="445" y="178" text-anchor="middle">CustomTkinter UI</text>
  <text class="p" x="445" y="200" text-anchor="middle">Browse · Generate · wait banner</text>
  <text class="tiny" x="445" y="218" text-anchor="middle">src/app/ui.py</text>

  <rect class="box-ui" x="622" y="140" width="210" height="96" rx="10"/>
  <text class="h" x="727" y="178" text-anchor="middle">Worker thread</text>
  <text class="p" x="727" y="200" text-anchor="middle">run_pipeline()</text>
  <text class="tiny" x="727" y="218" text-anchor="middle">window stays responsive</text>

  <rect class="box-side" x="860" y="140" width="192" height="96" rx="10"/>
  <text class="h" x="956" y="172" text-anchor="middle">HF model cache</text>
  <text class="p" x="956" y="194" text-anchor="middle">htdemucs_6s ONNX</text>
  <text class="tiny" x="956" y="214" text-anchor="middle">prefetch on launch</text>

  <path class="line" d="M 268 188 H 316"/>
  <path class="line" d="M 570 188 H 618"/>

  <!-- Layer 2: separate -->
  <rect class="band" x="24" y="284" width="1052" height="300" rx="12"/>
  <text class="band-label" x="44" y="310">LAYER 2  ·  SEPARATE  ·  this is the slow part</text>

  <rect class="box" x="48" y="332" width="240" height="88" rx="10"/>
  <text class="h" x="168" y="368" text-anchor="middle">FFmpeg decode</text>
  <text class="p" x="168" y="390" text-anchor="middle">stereo 44.1 kHz temp WAV</text>

  <rect class="box" x="360" y="320" width="300" height="112" rx="10"/>
  <text class="h" x="510" y="356" text-anchor="middle">Demucs  htdemucs_6s</text>
  <text class="p" x="510" y="380" text-anchor="middle">6 stems · ~7.8 s audio chunks</text>
  <text class="tiny" x="510" y="402" text-anchor="middle">drums · bass · other · vocals · guitar · piano</text>
  <text class="tiny" x="510" y="418" text-anchor="middle">src/pipeline/separate.py</text>

  <rect class="box-side" x="760" y="332" width="280" height="88" rx="10"/>
  <text class="h" x="900" y="368" text-anchor="middle">Hugging Face download</text>
  <text class="p" x="900" y="390" text-anchor="middle">first run only · then reused</text>

  <path class="line" d="M 168 236 V 332"/>
  <path class="line" d="M 288 376 H 356"/>
  <path class="line-muted" d="M 760 376 H 664"/>
  <path class="line-muted" d="M 956 236 V 332"/>

  <rect class="box" x="120" y="488" width="280" height="72" rx="10"/>
  <text class="h" x="260" y="518" text-anchor="middle">guitar.wav</text>
  <text class="p" x="260" y="540" text-anchor="middle">isolated guitar stem</text>

  <rect class="box" x="620" y="488" width="360" height="72" rx="10"/>
  <text class="h" x="800" y="518" text-anchor="middle">backing.wav</text>
  <text class="p" x="800" y="540" text-anchor="middle">drums + bass + vocals + piano + other   (no guitar)</text>

  <path class="line" d="M 420 432 V 460 H 260 V 488"/>
  <path class="line-muted" d="M 600 432 V 460 H 800 V 488"/>

  <!-- Layer 3: analyze -->
  <rect class="band" x="24" y="604" width="1052" height="168" rx="12"/>
  <text class="band-label" x="44" y="630">LAYER 3  ·  ANALYZE</text>

  <rect class="box" x="120" y="652" width="280" height="96" rx="10"/>
  <text class="h" x="260" y="688" text-anchor="middle">Basic Pitch</text>
  <text class="p" x="260" y="710" text-anchor="middle">audio ’ note times + MIDI</text>
  <text class="tiny" x="260" y="730" text-anchor="middle">not guitar tab · E2E6 window</text>

  <rect class="box" x="660" y="652" width="280" height="96" rx="10"/>
  <text class="h" x="800" y="688" text-anchor="middle">librosa beat_track</text>
  <text class="p" x="800" y="710" text-anchor="middle">one BPM for the whole song</text>
  <text class="tiny" x="800" y="730" text-anchor="middle">no mid-song tempo map</text>

  <path class="line" d="M 260 560 V 652"/>
  <path class="line-muted" d="M 800 560 V 652"/>

  <!-- Layer 4: chart -->
  <rect class="band" x="24" y="792" width="1052" height="168" rx="12"/>
  <text class="band-label" x="44" y="818">LAYER 4  ·  CHART  ·  heuristic, not official authoring</text>

  <rect class="box" x="160" y="840" width="340" height="96" rx="10"/>
  <text class="h" x="330" y="876" text-anchor="middle">Map MIDI ’ 5 frets</text>
  <text class="p" x="330" y="898" text-anchor="middle">tonic guess · scale bands · chords cap 3</text>
  <text class="tiny" x="330" y="918" text-anchor="middle">snap 16th / 32nd · resolution 192</text>

  <rect class="box" x="580" y="840" width="360" height="96" rx="10"/>
  <text class="h" x="760" y="876" text-anchor="middle">Thin difficulties</text>
  <text class="p" x="760" y="898" text-anchor="middle">Expert full · Hard 2 · Medium 2 · Easy 1</text>
  <text class="tiny" x="760" y="918" text-anchor="middle">copies of Expert, not re-transcribed</text>

  <path class="line" d="M 260 748 V 780 H 330 V 840"/>
  <path class="line-muted" d="M 800 748 V 780 H 760 V 840"/>
  <path class="line" d="M 500 888 H 576"/>

  <!-- Layer 5: output -->
  <rect class="band" x="24" y="980" width="1052" height="310" rx="12"/>
  <text class="band-label" x="44" y="1006">LAYER 5  ·  PACKAGE  ·  Clone Hero song folder</text>

  <rect class="box-out" x="64" y="1028" width="220" height="88" rx="10"/>
  <text class="h" x="174" y="1062" text-anchor="middle">song.ogg</text>
  <text class="p" x="174" y="1084" text-anchor="middle">backing · no guitar</text>

  <rect class="box-out" x="308" y="1028" width="220" height="88" rx="10"/>
  <text class="h" x="418" y="1062" text-anchor="middle">guitar.ogg</text>
  <text class="p" x="418" y="1084" text-anchor="middle">isolated guitar</text>

  <rect class="box-out" x="552" y="1028" width="220" height="88" rx="10"/>
  <text class="h" x="662" y="1062" text-anchor="middle">song.ini</text>
  <text class="p" x="662" y="1084" text-anchor="middle">name · artist · length</text>

  <rect class="box-out" x="796" y="1028" width="240" height="88" rx="10"/>
  <text class="h" x="916" y="1062" text-anchor="middle">notes.chart</text>
  <text class="p" x="916" y="1084" text-anchor="middle">Expert / Hard / Medium / Easy</text>

  <rect class="box-ui" x="300" y="1160" width="500" height="100" rx="10"/>
  <text class="h" x="550" y="1198" text-anchor="middle">Clone Hero song folder</text>
  <text class="p" x="550" y="1220" text-anchor="middle">Documents\Clone Hero\Songs\&lt;Song Name&gt;</text>
  <text class="tiny" x="550" y="1240" text-anchor="middle">Scan Songs · guitar chart only · not affiliated with Guitar Hero / Clone Hero</text>

  <path class="line" d="M 330 936 V 1000 H 174 V 1028"/>
  <path class="line" d="M 418 1028 V 1000"/>
  <path class="line" d="M 662 1028 V 1000"/>
  <path class="line" d="M 760 936 V 1000 H 916 V 1028"/>
  <path class="line" d="M 174 1116 V 1140 H 550 V 1160"/>
  <path class="line" d="M 418 1116 V 1140"/>
  <path class="line" d="M 662 1116 V 1140"/>
  <path class="line" d="M 916 1116 V 1140"/>
</svg>
